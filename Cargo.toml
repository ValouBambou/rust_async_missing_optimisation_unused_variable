[package]
name = "minimal-bug-repro"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-futures = "0.1.2"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["unstable-pac",  "critical-section-impl", "rp2040"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
panic-probe = "1.0.0"
